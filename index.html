<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <span class="eyebrow">ПРОСТОЙ РАСЧЁТ</span>
      <h1>Смета за 5 минут</h1>
      <p>Добавьте позиции и цены — смета посчитает всё сама.</p>
    </header>

    <section class="card" aria-labelledby="details-heading">
      <h2 id="details-heading">Реквизиты</h2>
      <div class="details-grid">
        <label>От кого<input type="text" name="sender" placeholder="Ваше имя или компания"></label>
        <label>Для кого<input type="text" name="recipient" placeholder="Имя или компания клиента"></label>
        <label>Номер сметы<input type="text" name="estimate-number" placeholder="Например, 001"></label>
        <label>Дата<input type="date" name="estimate-date" id="estimate-date"></label>
      </div>
    </section>

    <section class="card positions" aria-labelledby="positions-heading">
      <div class="section-heading">
        <h2 id="positions-heading">Позиции</h2>
        <span class="muted">Суммы в тенге</span>
      </div>
      <table>
        <caption class="sr-only">Позиции сметы: количество, цена и сумма</caption>
        <thead>
          <tr><th scope="col">Наименование</th><th scope="col">Количество</th><th scope="col">Единица</th><th scope="col">Цена, ₸</th><th scope="col" class="amount-heading">Сумма</th><th scope="col"><span class="sr-only">Удаление</span></th></tr>
        </thead>
        <tbody id="items"></tbody>
      </table>
      <div class="add-area">
        <button type="button" id="add-item" class="add-button">+ Добавить позицию</button>
        <p class="keyboard-hint">Enter в последней строке добавит новую позицию.</p>
      </div>
    </section>

    <section class="total-card" aria-labelledby="total-heading">
      <h2 id="total-heading">Итого к оплате</h2>
      <output id="total" aria-live="polite" aria-atomic="true">0 ₸</output>
    </section>
  </main>

  <template id="item-template">
    <tr>
      <td class="name-cell"><label><span class="sr-only mobile-label">Наименование</span><input type="text" data-field="name" placeholder="Товар или услуга"></label></td>
      <td><label><span class="sr-only mobile-label">Количество</span><input type="text" inputmode="decimal" data-field="quantity" placeholder="0" autocomplete="off" spellcheck="false"></label></td>
      <td><label><span class="sr-only mobile-label">Единица</span><select data-field="unit"><option value="шт">шт</option><option value="час">час</option><option value="услуга">услуга</option></select></label></td>
      <td><label><span class="sr-only mobile-label">Цена, ₸</span><input type="text" inputmode="decimal" data-field="price" placeholder="0" autocomplete="off" spellcheck="false"></label></td>
      <td class="line-total-cell"><span class="mobile-only">Сумма</span><output data-field="amount" aria-label="Сумма строки">0 ₸</output></td>
      <td class="delete-cell"><button type="button" class="delete-button" aria-label="Удалить позицию" title="Удалить позицию">✕</button></td>
    </tr>
  </template>
</body>
</html>
